<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">CellSAM 显微图像到实例轮廓</title>
  <desc id="desc">研究项目流程示意：显微图像、候选区域、实例分割轮廓与评估审计。</desc>
  <style>
    .bg{fill:#e8eef0}.ink{fill:#184f50}.muted{fill:#667571}.cyan{fill:#2c9aa0}.coral{fill:#d26a52}.paper{fill:#fffdf8;stroke:#2c7773;stroke-width:4}.step{opacity:0;animation:show 8s ease-in-out infinite}.step-a{animation-delay:0s}.step-b{animation-delay:2s}.step-c{animation-delay:4s}.step-d{animation-delay:6s}@keyframes show{0%,8%{opacity:0;transform:translateY(12px)}14%,31%{opacity:1;transform:translateY(0)}38%,100%{opacity:0;transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){.step{animation:none;opacity:1}}
  </style>
  <rect class="bg" width="960" height="540"/><text x="64" y="72" class="ink" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">CellSAM · MICROSCOPY / CONTOURS / AUDIT</text>
  <g class="step step-a"><rect x="170" y="118" width="620" height="320" rx="25" fill="#1b3036"/><g fill="#789ca0" opacity=".85"><circle cx="315" cy="220" r="74"/><circle cx="515" cy="210" r="92"/><circle cx="650" cy="325" r="72"/><circle cx="300" cy="360" r="60"/><circle cx="505" cy="350" r="61"/></g><g fill="#c6e5e8" opacity=".38"><circle cx="340" cy="190" r="25"/><circle cx="540" cy="180" r="29"/><circle cx="620" cy="300" r="23"/></g><text x="480" y="410" text-anchor="middle" fill="#fffdf8" font-family="Arial,sans-serif" font-size="20" font-weight="700">显微图像输入</text></g>
  <g class="step step-b"><rect x="170" y="118" width="620" height="320" rx="25" fill="#1b3036"/><g fill="#789ca0" opacity=".7"><circle cx="315" cy="220" r="74"/><circle cx="515" cy="210" r="92"/><circle cx="650" cy="325" r="72"/><circle cx="300" cy="360" r="60"/><circle cx="505" cy="350" r="61"/></g><g fill="none" stroke="#f1c46b" stroke-width="5"><rect x="250" y="144" width="180" height="142" rx="12"/><rect x="432" y="136" width="170" height="160" rx="12"/><rect x="574" y="260" width="154" height="130" rx="12"/></g><text x="480" y="410" text-anchor="middle" fill="#f1c46b" font-family="Arial,sans-serif" font-size="20" font-weight="700">候选区域</text></g>
  <g class="step step-c"><rect x="170" y="118" width="620" height="320" rx="25" fill="#1b3036"/><g fill="none" stroke="#2c9aa0" stroke-width="6"><path d="M260 237c-22-78 75-128 131-76 46 43 17 119-44 130-43 8-78-16-87-54Z"/><path d="M458 205c-7-88 122-113 155-37 28 64-31 126-92 119-37-5-60-31-63-82Z"/><path d="M584 342c-12-69 71-108 122-64 42 37 13 106-40 115-43 7-76-11-82-51Z"/><path d="M245 364c-9-59 65-91 111-52 40 34 15 91-31 101-43 9-74-10-80-49Z"/></g><text x="480" y="410" text-anchor="middle" fill="#b9dce0" font-family="Arial,sans-serif" font-size="20" font-weight="700">实例分割轮廓</text></g>
  <g class="step step-d"><rect class="paper" x="170" y="118" width="620" height="320" rx="25"/><text x="222" y="178" class="coral" font-family="Arial,sans-serif" font-size="19" font-weight="700">CellSAM</text><text x="222" y="224" class="ink" font-family="Arial,sans-serif" font-size="28" font-weight="700">评估与结果审计</text><text x="222" y="270" class="muted" font-family="Arial,sans-serif" font-size="18">输入 → 候选 → 轮廓 → 可复查结论</text><g fill="#d7e8df"><rect x="222" y="318" width="124" height="50" rx="10"/><rect x="362" y="318" width="124" height="50" rx="10"/><rect x="502" y="318" width="160" height="50" rx="10"/></g><g fill="#184f50" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><text x="284" y="349">输入</text><text x="424" y="349">分割</text><text x="582" y="349">审计</text></g></g>
</svg>

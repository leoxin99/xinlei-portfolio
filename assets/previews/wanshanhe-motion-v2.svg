<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">问山河摇签、地点揭晓与入册</title>
  <desc id="desc">基于当前问山河产品流程的八秒无声循环：摇签、地点卡揭晓、新卡自动入册。</desc>
  <style>
    .bg{fill:#eaf1ec}.ink{fill:#184f50}.muted{fill:#667571}.coral{fill:#d26a52}.paper{fill:#fffdf8;stroke:#2c7773;stroke-width:4}.step{opacity:0;animation:show 8s ease-in-out infinite}.step-a{animation-delay:0s}.step-b{animation-delay:2s}.step-c{animation-delay:4s}.step-d{animation-delay:6s}@keyframes show{0%,8%{opacity:0;transform:translateY(12px)}14%,31%{opacity:1;transform:translateY(0)}38%,100%{opacity:0;transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){.step{animation:none;opacity:1}}
  </style>
  <rect class="bg" width="960" height="540"/>
  <text x="64" y="72" class="ink" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">问山河 · DRAW / REVEAL / ALBUM</text>
  <g class="step step-a"><rect x="355" y="130" width="250" height="280" rx="30" fill="#f6eee1" stroke="#d26a52" stroke-width="4"/><path d="M480 185v155M404 262h152" stroke="#d26a52" stroke-width="7" stroke-linecap="round"/><circle cx="480" cy="262" r="25" fill="#fffdf8"/><text x="480" y="382" text-anchor="middle" class="ink" font-family="Arial,sans-serif" font-size="23" font-weight="700">摇一签</text></g>
  <g class="step step-b"><rect class="paper" x="310" y="108" width="340" height="318" rx="24"/><circle cx="480" cy="184" r="44" fill="#f1c46b"/><path d="M455 178c14-28 37-24 50-2-18-5-32 5-50 2Z" fill="#2c7773"/><text x="480" y="280" text-anchor="middle" class="ink" font-family="Georgia,serif" font-size="34">新地点卡</text><text x="480" y="326" text-anchor="middle" class="muted" font-family="Arial,sans-serif" font-size="19">揭晓一个去处</text><text x="480" y="378" text-anchor="middle" class="coral" font-family="Arial,sans-serif" font-size="18" font-weight="700">地点揭晓</text></g>
  <g class="step step-c"><rect class="paper" x="214" y="132" width="532" height="272" rx="26"/><rect x="250" y="168" width="188" height="200" rx="18" fill="#f1c46b"/><path d="M282 245c30-52 90-45 124 7-45-8-77 15-124-7Z" fill="#2c7773"/><text x="344" y="330" text-anchor="middle" class="ink" font-family="Georgia,serif" font-size="24">地点卡</text><text x="480" y="214" class="ink" font-family="Arial,sans-serif" font-size="24" font-weight="700">新卡自动入册</text><text x="480" y="260" class="muted" font-family="Arial,sans-serif" font-size="19">收藏关系被保留</text><circle cx="500" cy="326" r="24" fill="#d26a52"/><path d="m488 326 9 9 17-21" fill="none" stroke="#fffdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="step step-d"><rect class="paper" x="165" y="118" width="630" height="310" rx="26"/><text x="205" y="172" class="coral" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">当前产品闭环</text><g transform="translate(205 208)"><rect width="145" height="150" rx="15" fill="#f1c46b"/><rect x="170" width="145" height="150" rx="15" fill="#d7e8df"/><rect x="340" width="145" height="150" rx="15" fill="#f6eee1"/><path d="M23 78c25-42 68-42 103 0-38-6-66 10-103 0Z" fill="#2c7773"/><path d="M193 78c25-42 68-42 103 0-38-6-66 10-103 0Z" fill="#184f50"/><path d="M363 78c25-42 68-42 103 0-38-6-66 10-103 0Z" fill="#d26a52"/></g><text x="480" y="400" text-anchor="middle" class="ink" font-family="Arial,sans-serif" font-size="22" font-weight="700">摇签 · 揭晓 · 入册</text></g>
</svg>

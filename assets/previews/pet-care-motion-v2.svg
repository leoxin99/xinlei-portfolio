<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">糖宠照护记录、趋势与复诊沟通</title>
  <desc id="desc">基于真实糖宠 Web App 的八秒无声流程预览：新增照护记录、趋势汇总、生成复诊沟通材料。</desc>
  <style>
    .bg{fill:#f6eee1}.ink{fill:#184f50}.muted{fill:#667571}.coral{fill:#d26a52}.paper{fill:#fffdf8;stroke:#d7c9b3;stroke-width:3}.step{opacity:0;animation:show 8s ease-in-out infinite}.step-a{animation-delay:0s}.step-b{animation-delay:2s}.step-c{animation-delay:4s}.step-d{animation-delay:6s}@keyframes show{0%,8%{opacity:0;transform:translateY(12px)}14%,31%{opacity:1;transform:translateY(0)}38%,100%{opacity:0;transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){.step{animation:none;opacity:1}}
  </style>
  <rect class="bg" width="960" height="540"/><text x="64" y="72" class="ink" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">糖宠照护 · LOG / TREND / FOLLOW-UP</text>
  <g class="step step-a"><rect class="paper" x="220" y="120" width="520" height="310" rx="25"/><text x="260" y="174" class="coral" font-family="Arial,sans-serif" font-size="20" font-weight="700">今日照护</text><rect x="260" y="210" width="440" height="54" rx="12" fill="#eaf1ec"/><circle cx="290" cy="237" r="12" fill="#2c7773"/><text x="320" y="245" class="ink" font-family="Arial,sans-serif" font-size="19">进食与治疗 · 血糖 · 体重 · 状态</text><rect x="260" y="292" width="180" height="58" rx="13" fill="#d26a52"/><text x="350" y="328" text-anchor="middle" fill="#fffdf8" font-family="Arial,sans-serif" font-size="19" font-weight="700">新增记录</text></g>
  <g class="step step-b"><rect class="paper" x="170" y="108" width="620" height="330" rx="25"/><text x="214" y="164" class="coral" font-family="Arial,sans-serif" font-size="20" font-weight="700">趋势汇总</text><path d="M225 355H735M225 215V355" stroke="#d7c9b3" stroke-width="3"/><path d="M246 321c60-86 102-12 151-62 46-47 70 15 114-49 55-80 91 5 191-72" fill="none" stroke="#2c7773" stroke-width="7" stroke-linecap="round"/><circle cx="702" cy="138" r="9" fill="#d26a52"/><text x="225" y="395" class="muted" font-family="Arial,sans-serif" font-size="17">按日、周、月回顾已记录事实</text></g>
  <g class="step step-c"><rect class="paper" x="200" y="100" width="560" height="344" rx="25"/><text x="246" y="158" class="coral" font-family="Arial,sans-serif" font-size="20" font-weight="700">复诊沟通材料</text><rect x="246" y="194" width="468" height="34" rx="8" fill="#eaf1ec"/><rect x="246" y="254" width="390" height="18" rx="9" fill="#d7e8df"/><rect x="246" y="288" width="430" height="18" rx="9" fill="#d7e8df"/><rect x="246" y="322" width="300" height="18" rx="9" fill="#d7e8df"/><path d="M650 372h64" stroke="#d26a52" stroke-width="6" stroke-linecap="round"/><text x="246" y="390" class="ink" font-family="Arial,sans-serif" font-size="18">整理记录，带去和兽医沟通</text></g>
  <g class="step step-d"><rect class="paper" x="200" y="140" width="560" height="260" rx="25"/><circle cx="316" cy="264" r="64" fill="#f1c46b"/><path d="M274 260c24-50 71-50 87 0-33-10-56 12-87 0Z" fill="#2c7773"/><text x="430" y="240" class="ink" font-family="Arial,sans-serif" font-size="27" font-weight="700">只记录已发生的事实</text><text x="430" y="280" class="muted" font-family="Arial,sans-serif" font-size="18">不提供诊断或剂量建议</text></g>
</svg>

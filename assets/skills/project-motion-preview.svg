<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Project Motion Preview</title>
  <desc id="desc">Facts become a brief, storyboard, poster, preview, and QA checklist.</desc>
  <style>
    .bg{fill:#eaf1ec}.paper{fill:#fffdf8;stroke:#2c7773;stroke-width:4}.ink{fill:#184f50}.muted{fill:#667571}.coral{fill:#d26a52}.step{opacity:0;animation:show 8s ease-in-out infinite}.step-a{animation-delay:0s}.step-b{animation-delay:2s}.step-c{animation-delay:4s}.step-d{animation-delay:6s}@keyframes show{0%,8%{opacity:0;transform:translateY(12px)}14%,31%{opacity:1;transform:translateY(0)}38%,100%{opacity:0;transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){.step{animation:none;opacity:1}}
  </style>
  <rect class="bg" width="960" height="540"/>
  <text x="64" y="72" class="ink" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">PROJECT MOTION PREVIEW</text>
  <g class="step step-a"><rect class="paper" x="178" y="128" width="604" height="286" rx="26"/><text x="226" y="196" class="coral" font-family="Arial,sans-serif" font-size="20" font-weight="700">01 · FACTS</text><text x="226" y="250" class="ink" font-family="Arial,sans-serif" font-size="28" font-weight="700">真实项目画面</text><text x="226" y="300" class="muted" font-family="Arial,sans-serif" font-size="20">任务 · 约束 · 事实边界</text><circle cx="700" cy="260" r="64" fill="#f1c46b"/><path d="M670 260h60M700 230v60" stroke="#184f50" stroke-width="8" stroke-linecap="round"/></g>
  <g class="step step-b"><rect class="paper" x="178" y="128" width="604" height="286" rx="26"/><text x="226" y="196" class="coral" font-family="Arial,sans-serif" font-size="20" font-weight="700">02 · STORYBOARD</text><rect x="226" y="228" width="132" height="112" rx="16" fill="#f1c46b"/><rect x="382" y="228" width="132" height="112" rx="16" fill="#d7e8df"/><rect x="538" y="228" width="132" height="112" rx="16" fill="#f6eee1"/><path d="M360 284h22m132 0h22" stroke="#d26a52" stroke-width="6" stroke-linecap="round"/><path d="m374 273 14 11-14 11m132-22 14 11-14 11" fill="#d26a52"/></g>
  <g class="step step-c"><rect class="paper" x="178" y="128" width="604" height="286" rx="26"/><text x="226" y="196" class="coral" font-family="Arial,sans-serif" font-size="20" font-weight="700">03 · POSTER + PREVIEW</text><rect x="226" y="228" width="300" height="112" rx="16" fill="#d7e8df"/><path d="M250 310c45-66 82-38 120-76 32-31 68 20 124-20" fill="none" stroke="#2c7773" stroke-width="8" stroke-linecap="round"/><rect x="562" y="228" width="108" height="112" rx="16" fill="#184f50"/><path d="M586 284h60M616 254v60" stroke="#f1c46b" stroke-width="8" stroke-linecap="round"/></g>
  <g class="step step-d"><rect class="paper" x="178" y="128" width="604" height="286" rx="26"/><text x="226" y="196" class="coral" font-family="Arial,sans-serif" font-size="20" font-weight="700">04 · QA</text><text x="226" y="258" class="ink" font-family="Arial,sans-serif" font-size="27" font-weight="700">hover · focus · mobile</text><text x="226" y="306" class="muted" font-family="Arial,sans-serif" font-size="20">reduced-motion · 404 · 体积</text><circle cx="686" cy="274" r="54" fill="#d26a52"/><path d="m658 274 18 18 38-43" fill="none" stroke="#fffdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
